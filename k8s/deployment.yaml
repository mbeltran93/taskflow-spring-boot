apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  labels:
    app: taskflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      containers:
        - name: taskflow-api
          # Reemplazar por la imagen publicada en Artifact Registry, ver README (seccion
          # "Despliegue en GCP"): gcr.io/<PROJECT_ID>/taskflow:<tag> o
          # <region>-docker.pkg.dev/<PROJECT_ID>/<repo>/taskflow:<tag>
          image: gcr.io/PROJECT_ID/taskflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: taskflow-config
          env:
            # DB_URL/DB_USERNAME/DB_PASSWORD/JWT_SECRET son sensibles: no van en el ConfigMap.
            # Se crean en un Secret aparte (ver README), nunca commiteado con valores reales.
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3
